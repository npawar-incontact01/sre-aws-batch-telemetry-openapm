AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS Batch Job Definition for sre-aws-batch-telemetry.
  Fargate platform with OTLP environment variables pre-configured.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  ServiceName:
    Type: String
    Default: sre-aws-batch-telemetry
  ContainerImage:
    Type: String
    Description: >
      Full ECR image URI including tag.
      Example: 300813158921.dkr.ecr.us-east-1.amazonaws.com/sre-aws-batch-telemetry:latest
  ExecutionRoleArn:
    Type: String
    Description: ARN of the Batch Execution Role (from iam-roles stack)
  JobRoleArn:
    Type: String
    Description: ARN of the Batch Job Role (from iam-roles stack)
  OtelEndpoint:
    Type: String
    Default: "https://apm-na1.service.nicecxone-dev.com:4317"
    Description: OTLP exporter endpoint
  OtelResourceAttributes:
    Type: String
    Default: "environment=ic-dev,account.id=300813158921"
    Description: Additional OTel resource attributes (key=value comma-separated)
  JobVcpu:
    Type: String
    Default: "0.25"
    Description: vCPU allocation for the Fargate task
  JobMemory:
    Type: Number
    Default: 512
    Description: Memory (MiB) allocation for the Fargate task
  Team:
    Type: String
    Default: sre
  CostCenter:
    Type: String
    Default: "0000"

Resources:

  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub "${ServiceName}-${EnvironmentName}-job"
      Type: container
      PlatformCapabilities:
        - FARGATE
      ContainerProperties:
        Image: !Ref ContainerImage
        ExecutionRoleArn: !Ref ExecutionRoleArn
        JobRoleArn: !Ref JobRoleArn
        FargatePlatformConfiguration:
          PlatformVersion: LATEST
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref JobVcpu
          - Type: MEMORY
            Value: !Sub "${JobMemory}"
        Environment:
          - Name: OTEL_EXPORTER_OTLP_ENDPOINT
            Value: !Ref OtelEndpoint
          - Name: OTEL_SERVICE_NAME
            Value: !Ref ServiceName
          - Name: OTEL_RESOURCE_ATTRIBUTES
            Value: !Ref OtelResourceAttributes
          - Name: PYTHONUNBUFFERED
            Value: "1"
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Sub "/aws/batch/${ServiceName}"
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: !Ref EnvironmentName
        NetworkConfiguration:
          AssignPublicIp: DISABLED
      RetryStrategy:
        Attempts: 2
      Timeout:
        AttemptDurationSeconds: 300
      Tags:
        Environment: !Ref EnvironmentName
        Service: !Ref ServiceName
        Team: !Ref Team
        CostCenter: !Ref CostCenter

  BatchJobLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/batch/${ServiceName}"
      RetentionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: !Ref ServiceName
        - Key: Team
          Value: !Ref Team
        - Key: CostCenter
          Value: !Ref CostCenter

Outputs:
  JobDefinitionArn:
    Description: ARN of the Batch Job Definition
    Value: !Ref BatchJobDefinition
    Export:
      Name: !Sub "${AWS::StackName}-JobDefinitionArn"

  JobDefinitionName:
    Description: Name of the Batch Job Definition
    Value: !Sub "${ServiceName}-${EnvironmentName}-job"
    Export:
      Name: !Sub "${AWS::StackName}-JobDefinitionName"
