AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Java Batch + Firelens (Brian's approach). Multi-container: app + Fluent Bit sidecar.
  Uses aws-for-fluent-bit:init-3.2.4 with S3 custom config (record_modifier +
  logs_body_key_attributes) to set service_name correctly in Loki.
  Pattern from R&D team (notification-manager-dynamic-routed).
  Traces/Metrics via Micrometer direct OTLP. Logs via Firelens -> OTLP -> Loki.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  ServiceName:
    Type: String
    Default: sre-batch-telemetry-java
  ContainerImage:
    Type: String
    Default: "public.ecr.aws/amazoncorretto/amazoncorretto:17"
  CodeS3Bucket:
    Type: String
    Default: "sre-batch-telemetry-code-723346695882"
  CodeS3Key:
    Type: String
    Default: "java/batch-telemetry.jar"
  ExecutionRoleArn:
    Type: String
    Description: ARN of the Batch Execution Role (from iam-roles stack)
  JobRoleArn:
    Type: String
    Description: ARN of the Batch Job Role (from iam-roles stack)
  OtelEndpoint:
    Type: String
    Default: "https://apm-na1.mon-sandbox.nicecxone-sbx.com:4318"
  OtelResourceAttributes:
    Type: String
    Default: "environment=mon-sandbox,account.id=723346695882,openapm_product_name=sre-batch-telemetry,service_name=sre-batch-telemetry-java,region=us-west-2"
  OpenapmProductName:
    Type: String
    Default: "sre-batch-telemetry"
  OtelEndpointHost:
    Type: String
    Default: "apm-na1.mon-sandbox.nicecxone-sbx.com"
  FirelensConfigS3Path:
    Type: String
    Default: "s3://sre-batch-telemetry-code-723346695882/fluent-bit/batch-fluent-bit.conf"
    Description: >
      S3 path to the Fluent Bit config file. The init-variant image downloads this
      at startup via aws_fluent_bit_init_s3_1 env var — works on Fargate unlike
      FirelensConfiguration S3 options which are ECS-only.
      Pattern from R&D team: saas-platform-ms-notification-manager-dynamic-routed.
  AppVcpu:
    Type: String
    Default: "1"
    AllowedValues: ["0.5", "1", "2", "4"]
  AppMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "4096", "8192"]
  Team:
    Type: String
    Default: sre
  CostCenter:
    Type: String
    Default: "0000"

Resources:

  # NOTE: Log groups are NOT managed by this stack to avoid EarlyValidation conflicts.
  # /aws/batch/${ServiceName}/app already exists (owned by sre-batch-java-dev-jobdef stack).
  # /aws/batch/${ServiceName}/firelens is auto-created by awslogs-create-group on first run.

  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub "${ServiceName}-${EnvironmentName}-firelens-job"
      Type: container
      PlatformCapabilities:
        - FARGATE
      Timeout:
        AttemptDurationSeconds: 600
      RetryStrategy:
        Attempts: 1
      # EcsProperties required for multi-container Batch (Firelens sidecar)
      # Multi-container Batch support added Feb 2024:
      # https://aws.amazon.com/about-aws/whats-new/2024/02/aws-batch-multi-container-jobs/
      # Firelens support for Batch added Apr 2025:
      # https://aws.amazon.com/about-aws/whats-new/2025/04/aws-batch-amazon-elastic-container-service-exec-firelens-log-router/
      EcsProperties:
        TaskProperties:
          - ExecutionRoleArn: !Ref ExecutionRoleArn
            TaskRoleArn: !Ref JobRoleArn
            PlatformVersion: LATEST
            NetworkConfiguration:
              AssignPublicIp: ENABLED
            Containers:

              # ── App container ──────────────────────────────────────────────
              # Traces (Micrometer) and metrics (Micrometer OTLP) go direct
              # to OTLP endpoint. Logs go to stdout → Firelens sidecar.
              - Name: app
                Image: !Ref ContainerImage
                Essential: true
                Command:
                  - "/bin/sh"
                  - "-c"
                  - !Sub |
                      curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip && \
                      cd /tmp && jar xf awscliv2.zip && \
                      chmod -R +x /tmp/aws && \
                      /tmp/aws/install -i /usr/local/aws -b /usr/local/bin && \
                      /usr/local/bin/aws s3 cp s3://${CodeS3Bucket}/${CodeS3Key} /app.jar --region us-west-2 && \
                      java -jar /app.jar
                ResourceRequirements:
                  # 0.75 vCPU + 0.25 vCPU (sidecar) = 1.0 vCPU total (valid Fargate task size)
                  # 1920 MiB + 128 MiB (sidecar) = 2048 MiB total (valid for 1 vCPU)
                  - Type: VCPU
                    Value: "0.75"
                  - Type: MEMORY
                    Value: "1920"
                # stdout -> Firelens -> custom Fluent Bit config (S3) -> OTLP /v1/logs -> Loki
                # The log_router sidecar's record_modifier adds service_name as a record field.
                # logs_body_key_attributes true promotes it to an OTLP log attribute.
                # OpenAPM collector reads that attribute -> correct service_name Loki label.
                LogConfiguration:
                  LogDriver: awsfirelens
                  Options: {}
                Environment:
                  - Name: OTEL_SERVICE_NAME
                    Value: !Ref ServiceName
                  - Name: OTEL_EXPORTER_OTLP_ENDPOINT
                    Value: !Ref OtelEndpoint
                  - Name: OTEL_RESOURCE_ATTRIBUTES
                    Value: !Ref OtelResourceAttributes
                  - Name: OTEL_EXPORTER_OTLP_PROTOCOL
                    Value: http/protobuf
                  - Name: ENVIRONMENT
                    Value: !Ref EnvironmentName
                  - Name: OPENAPM_PRODUCT_NAME
                    Value: !Ref OpenapmProductName
                  - Name: AWS_REGION
                    Value: !Ref "AWS::Region"
                  - Name: AWS_ACCOUNT_ID
                    Value: !Ref "AWS::AccountId"

              # ── Firelens log router sidecar ────────────────────────────────
              # Uses the init-variant image which downloads Fluent Bit config from S3
              # at container startup via aws_fluent_bit_init_s3_1 env var.
              # This is the same pattern as the R&D team's notification-manager-dynamic-routed.
              # The init-variant works on Fargate (container downloads config itself,
              # unlike FirelensConfiguration S3 option which is ECS-infrastructure-only).
              #
              # The custom config (batch-fluent-bit.conf) uses:
              #   record_modifier: adds service_name, openapm_product_name, region
              #   logs_body_key_attributes true: promotes fields to OTLP log attributes
              #   -> OpenAPM collector maps service_name attribute to Loki label correctly
              - Name: log_router
                Image: "public.ecr.aws/aws-observability/aws-for-fluent-bit:init-3.2.4"
                Essential: false
                FirelensConfiguration:
                  Type: fluentbit
                  Options:
                    enable-ecs-log-metadata: "false"
                Environment:
                  # Used by record_modifier in batch-fluent-bit.conf
                  - Name: SERVICE_NAME
                    Value: !Ref ServiceName
                  - Name: PRODUCT_NAME
                    Value: !Ref OpenapmProductName
                  - Name: REGION
                    Value: !Ref "AWS::Region"
                  - Name: APM_HOST
                    Value: !Ref OtelEndpointHost
                  # init-variant: download custom Fluent Bit config from S3 at startup
                  - Name: aws_fluent_bit_init_s3_1
                    Value: !Ref FirelensConfigS3Path
                ResourceRequirements:
                  - Type: VCPU
                    Value: "0.25"
                  - Type: MEMORY
                    Value: "128"
                LogConfiguration:
                  LogDriver: awslogs
                  Options:
                    awslogs-group: "/aws/batch/sre-batch-telemetry-java/app"
                    awslogs-region: !Ref "AWS::Region"
                    awslogs-stream-prefix: firelens-sidecar

      Tags:
        Environment: !Ref EnvironmentName
        Service: !Ref ServiceName
        Team: !Ref Team
        CostCenter: !Ref CostCenter
        Approach: "Brian-Firelens"

Outputs:
  JobDefinitionArn:
    Value: !Ref BatchJobDefinition
    Description: ARN of the Firelens-based Batch job definition
  FirelensLogGroup:
    Value: "/aws/batch/sre-batch-telemetry-java/app"
    Description: CloudWatch log group for Firelens sidecar operational logs (stream prefix firelens-sidecar/)
  AppLogGroup:
    Value: "/aws/batch/sre-batch-telemetry-java/app"
    Description: CloudWatch log group for app stdout (JSON)
  LokiQuery:
    Value: '{service_name="sre-batch-telemetry-java"}'
    Description: >
      Grafana Loki query to find these logs. service_name is set correctly via
      record_modifier + logs_body_key_attributes in the custom Fluent Bit config.
      Pattern from R&D team notification-manager-dynamic-routed.
