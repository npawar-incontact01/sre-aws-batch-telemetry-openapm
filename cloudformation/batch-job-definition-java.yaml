AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS Batch Job Definition for Java Spring Boot telemetry POC.
  Single container (EcsProperties): app only — no Firelens sidecar.
  All 3 signals via OTLP/HTTP to apm-na1:4318 (same VPC endpoint):
    Traces  -> /v1/traces  -> Tempo
    Metrics -> /v1/metrics -> Mimir
    Logs    -> /v1/logs    -> Loki (via OTel logback appender, direct OTLP)
  NOTE: Fluent Bit 1.9.x (aws-for-fluent-bit:stable) opentelemetry plugin
  does not handle logs (metrics only). Direct OTLP from the app is required.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  ServiceName:
    Type: String
    Default: sre-batch-telemetry-java
  ContainerImage:
    Type: String
    Default: "public.ecr.aws/amazoncorretto/amazoncorretto:17"
  CodeS3Bucket:
    Type: String
    Default: "sre-batch-telemetry-code-723346695882"
  CodeS3Key:
    Type: String
    Default: "java/batch-telemetry.jar"
  ExecutionRoleArn:
    Type: String
    Description: ARN of the Batch Execution Role (from iam-roles stack)
  JobRoleArn:
    Type: String
    Description: ARN of the Batch Job Role (from iam-roles stack)
  OtelEndpoint:
    Type: String
    Default: "https://apm-na1.mon-sandbox.nicecxone-sbx.com:4318"
    Description: OTLP endpoint for traces + metrics
  OtelResourceAttributes:
    Type: String
    Default: "environment=mon-sandbox,account.id=723346695882,openapm_product_name=sre-batch-telemetry,service_name=sre-batch-telemetry-java,region=us-west-2"
  OpenapmProductName:
    Type: String
    Default: "sre-batch-telemetry"
  AppVcpu:
    Type: String
    Default: "0.75"
    AllowedValues: ["0.25", "0.5", "0.75", "1", "2", "4"]
    Description: vCPU for the app container
  AppMemory:
    Type: String
    Default: "1920"
    AllowedValues: ["512", "896", "1024", "1920", "2048", "4096", "8192"]
    Description: Memory MiB for the app container
  Team:
    Type: String
    Default: sre
  CostCenter:
    Type: String
    Default: "0000"

Resources:
  # App stdout (JSON) — visible in CloudWatch for debugging
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/batch/${ServiceName}/app"
      RetentionInDays: 7

  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub "${ServiceName}-${EnvironmentName}-job"
      Type: container
      PlatformCapabilities:
        - FARGATE
      Timeout:
        AttemptDurationSeconds: 600
      RetryStrategy:
        Attempts: 1
      # EcsProperties used even for single container (required for Fargate Batch)
      EcsProperties:
        TaskProperties:
          - ExecutionRoleArn: !Ref ExecutionRoleArn
            TaskRoleArn: !Ref JobRoleArn
            PlatformVersion: LATEST
            NetworkConfiguration:
              AssignPublicIp: ENABLED
            Containers:

              # -- App container --
              - Name: app
                Image: !Ref ContainerImage
                Essential: true
                Command:
                  - "/bin/sh"
                  - "-c"
                  - !Sub |
                      curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip && \
                      cd /tmp && jar xf awscliv2.zip && \
                      chmod -R +x /tmp/aws && \
                      /tmp/aws/install -i /usr/local/aws -b /usr/local/bin && \
                      /usr/local/bin/aws s3 cp s3://${CodeS3Bucket}/${CodeS3Key} /app.jar --region us-west-2 && \
                      java -jar /app.jar
                ResourceRequirements:
                  - Type: VCPU
                    Value: !Ref AppVcpu
                  - Type: MEMORY
                    Value: !Ref AppMemory
                # App stdout (JSON via logstash-logback-encoder) -> CloudWatch
                # Logs also go directly via OTel logback appender -> OTLP/HTTP -> Loki
                LogConfiguration:
                  LogDriver: awslogs
                  Options:
                    awslogs-group: !Ref AppLogGroup
                    awslogs-region: !Ref "AWS::Region"
                    awslogs-stream-prefix: app
                Environment:
                  - Name: OTEL_SERVICE_NAME
                    Value: !Ref ServiceName
                  - Name: OTEL_EXPORTER_OTLP_ENDPOINT
                    Value: !Ref OtelEndpoint
                  - Name: OTEL_RESOURCE_ATTRIBUTES
                    Value: !Ref OtelResourceAttributes
                  - Name: OTEL_EXPORTER_OTLP_PROTOCOL
                    Value: http/protobuf
                  - Name: ENVIRONMENT
                    Value: !Ref EnvironmentName
                  - Name: OPENAPM_PRODUCT_NAME
                    Value: !Ref OpenapmProductName
                  - Name: AWS_REGION
                    Value: !Ref "AWS::Region"
                  - Name: AWS_ACCOUNT_ID
                    Value: !Ref "AWS::AccountId"


      Tags:
        Environment: !Ref EnvironmentName
        Service: !Ref ServiceName
        Team: !Ref Team
        CostCenter: !Ref CostCenter

Outputs:
  JobDefinitionArn:
    Value: !Ref BatchJobDefinition
    Description: ARN of the Batch job definition
  AppLogGroupName:
    Value: !Ref AppLogGroup
    Description: CloudWatch log group for app stdout (JSON)
