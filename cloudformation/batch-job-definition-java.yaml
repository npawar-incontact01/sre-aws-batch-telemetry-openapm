    Type: String
    Default: "0.5"
    AllowedValues: ["0.25", "0.5", "1", "2", "4"]
  JobMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "4096", "8192"]

Resources:
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/batch/${ServiceName}"
      RetentionInDays: 7

  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub "${ServiceName}-${EnvironmentName}-job"
      Type: container
      PlatformCapabilities:
        - FARGATE
      Timeout:
        AttemptDurationSeconds: 600
      RetryStrategy:
        Attempts: 1
      ContainerProperties:
        Image: !Ref ContainerImage
        ExecutionRoleArn: !Ref ExecutionRoleArn
        JobRoleArn: !Ref JobRoleArn
        FargatePlatformConfiguration:
          PlatformVersion: LATEST
        NetworkConfiguration:
          AssignPublicIp: ENABLED
        Command:
          - "/bin/sh"
          - "-c"
          - !Sub |
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip && \
              cd /tmp && jar xf awscliv2.zip && \
              chmod -R +x /tmp/aws && \
              /tmp/aws/install -i /usr/local/aws -b /usr/local/bin && \
              /usr/local/bin/aws s3 cp s3://${CodeS3Bucket}/${CodeS3Key} /app.jar --region us-west-2 && \
              java -jar /app.jar
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref JobVcpu
          - Type: MEMORY
            Value: !Ref JobMemory
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref AppLogGroup
            awslogs-region: !Ref "AWS::Region"
            awslogs-stream-prefix: app
        Environment:
          - Name: OTEL_SERVICE_NAME
            Value: !Ref ServiceName
          - Name: OTEL_EXPORTER_OTLP_ENDPOINT
            Value: !Ref OtelEndpoint
          - Name: OTEL_RESOURCE_ATTRIBUTES
            Value: !Ref OtelResourceAttributes
          - Name: OTEL_EXPORTER_OTLP_PROTOCOL
            Value: http/protobuf
          - Name: ENVIRONMENT
            Value: !Ref EnvironmentName
          - Name: OPENAPM_PRODUCT_NAME
            Value: !Ref OpenapmProductName
          - Name: AWS_REGION
            Value: !Ref "AWS::Region"
          - Name: AWS_ACCOUNT_ID
            Value: !Ref "AWS::AccountId"

Outputs:
  JobDefinitionArn:
    Value: !Ref BatchJobDefinition
  AppLogGroupName:
    Value: !Ref AppLogGroup
