[SERVICE]
  Log_Level  warn
  Flush      0.1

# === FireLens INPUT — receives app container stdout ===
[INPUT]
  Name           forward
  unix_path      /var/run/fluent.sock
  Mem_Buf_Limit  17M

# === FILTER — inject service_name and other labels as record fields ===
# These fields are promoted to OTLP log attributes by logs_body_key_attributes true
# The OpenAPM collector reads these to set the correct service_name Loki label.
# Pattern matches R&D team: saas-platform-ms-notification-manager-dynamic-routed
[FILTER]
  Name    record_modifier
  Match   *
  Record  service_name         ${SERVICE_NAME}
  Record  openapm_product_name ${PRODUCT_NAME}
  Record  region               ${REGION}

# === OUTPUT — OpenTelemetry (OpenAPM) via OTLP/HTTP ===
# logs_body_key: the 'log' field becomes the OTLP log record body
# logs_body_key_attributes true: all other fields (service_name, etc.)
#   become OTLP log record attributes — OpenAPM collector maps these to Loki labels
[OUTPUT]
  Name                      opentelemetry
  Match                     *
  Host                      ${APM_HOST}
  Port                      4318
  logs_uri                  /v1/logs
  TLS                       On
  logs_body_key             $log
  logs_body_key_attributes  true
  compress                  gzip
  Retry_Limit               no_retries

# === OUTPUT — CloudWatch (fallback / debug) ===
[OUTPUT]
  Name               cloudwatch_logs
  Match              *
  region             ${REGION}
  log_group_name     /aws/batch/${SERVICE_NAME}
  log_stream_prefix  firelens-
  auto_create_group  true
  log_key            log
  Retry_Limit        2
