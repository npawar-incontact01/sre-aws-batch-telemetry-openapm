[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    HTTP_Server   Off
    Parsers_File  /fluent-bit/etc/parsers.conf

# Add resource attributes for Loki stream labels
[FILTER]
    Name          record_modifier
    Match         app-firelens*
    Record        service_name sre-batch-telemetry-java
    Record        openapm_product_name sre-batch-telemetry
    Record        environment dev
    Record        region us-west-2

# Forward app container logs to OTel collector via OTLP/HTTP -> Loki
[OUTPUT]
    Name          opentelemetry
    Match         app-firelens*
    Host          apm-na1.mon-sandbox.nicecxone-sbx.com
    Port          4318
    uri           /v1/logs
    tls           on
    tls.verify    on
    Retry_Limit   3

# Discard everything else (log_router own logs go to CloudWatch via awslogs driver)
[OUTPUT]
    Name          null
    Match         *
